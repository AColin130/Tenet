name: 文档 / 流程改进
description: Tenet 元层文档、AI 引导、关口或模板
title: "[docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        请只涉及 **`tenet/**`** 或根 `CONTRIBUTING.md` / `README.md` / `CHANGELOG.md`。
        流程 SSOT：[`tenet/AGENTS.md`](../tenet/AGENTS.md)
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题？
      description: 用户/AI/维护者哪类痛点？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方向（可简短）
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 不涉及业务 C++ 脚手架或默认 CMake 树
          required: true
        - label: 不扩大 tenet/AGENTS 与 process 的矛盾条文
          required: false
